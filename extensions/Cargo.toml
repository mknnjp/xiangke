[workspace]
resolver = "2"
members = ["core", "battle", "godot_bridge", "tools/xiangke_checker", "tools/roster_report"]

[workspace.package]
edition = "2024"
version = "0.1.0"
authors = ["makinosp"]
license = "AGPL-3"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rand = "0.8"
thiserror = "2"
strum = { version = "0.26", features = ["derive"] }
proptest = { version = "1" }
